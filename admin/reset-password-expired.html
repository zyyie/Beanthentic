<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beanthentic | Reset Link Expired</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="stylesheet" href="../css/forgot-password.css" />
</head>

<body class="login-page">
  <main id="main" class="login-main">
    <div class="login-wrap">
      <section class="card login-card-split" aria-label="Reset link expired">
        <div class="login-card-left" aria-hidden="true">
          <img src="../assets/images/logo.png" alt="Beanthentic logo" class="login-card-logo" />
        </div>

        <div class="login-card-right">
          <div class="card-header">
            <h2 class="card-title">Link Expired</h2>
            <p class="card-desc">This password reset link is invalid or has expired.</p>
          </div>

          <div class="form" style="padding-top: 0.25rem;">
            <p class="fineprint form-alert form-alert-error" style="text-align: left;">
              {{ message or "Request a new reset link and try again." }}
            </p>
            <a class="btn" href="{{ url_for('forgot_password') }}"
              style="display: block; text-align: center; text-decoration: none;">Request New Code</a>
            <div class="login-form-footer">
              <p class="fineprint">
                <a class="link" href="{{ url_for('login') }}">Back to Login</a>
              </p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>

</html>
