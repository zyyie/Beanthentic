<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beanthentic | Reset Password</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/forgot-password.css" />
  </head>

  <body class="login-page">
    <main id="main" class="login-main">
      <div class="login-wrap">
        <section class="card login-card-split" aria-label="Reset password form">
          <div class="login-card-left" aria-hidden="true">
            <img
              src="../assets/images/logo.png"
              alt="Beanthentic logo"
              class="login-card-logo"
            />
          </div>

          <div class="login-card-right">
            <div class="card-header">
              <h2 class="card-title">Set New Password</h2>
              <p class="card-desc">
                Create a new password for account ending in <strong>{{ phone_suffix }}</strong>.
              </p>
            </div>

            <form class="form" action="{{ url_for('reset_password', token=token) }}" method="post">
              {% if error %}
              <p class="fineprint form-alert form-alert-error">{{ error }}</p>
              {% endif %}

              <div class="field">
                <label class="label" for="newPassword">New Password:</label>
                <p class="field-hint">At least 8 characters, with one letter and one number.</p>
                <div class="password-wrap">
                  <input
                    class="input"
                    id="newPassword"
                    name="newPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                  />
                  <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="Show password" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"></svg>
                  </button>
                </div>
              </div>

              <div class="field">
                <label class="label" for="confirmPassword">Confirm Password:</label>
                <div class="password-wrap">
                  <input
                    class="input"
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    required
                  />
                  <button type="button" class="password-toggle" id="toggleConfirmPassword" aria-label="Show password" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"></svg>
                  </button>
                </div>
              </div>

              <button class="btn" type="submit">SAVE NEW PASSWORD</button>

              <div class="login-form-footer">
                <p class="fineprint">
                  <a class="link" href="{{ url_for('login') }}">Back to Login</a>
                </p>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>
    <script src="../js/auth-password-toggle.js"></script>
    <script>
      initPasswordToggles([
        ["toggleNewPassword", "newPassword"],
        ["toggleConfirmPassword", "confirmPassword"],
      ]);
    </script>
  </body>
</html>
