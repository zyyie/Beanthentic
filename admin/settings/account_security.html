<div class="settings-card">
  <h3>Password Reset</h3>
  <p style="margin-top: -0.25rem; color: #6c757d; font-size: 0.95rem;">
    Secure workflow: Enter your <b>current password</b> to verify before changing to a new password.
  </p>
  <form id="passwordForm">
    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <input type="password" id="currentPassword" name="current_password" required autocomplete="current-password" />
      <p class="form-field-error" id="currentPasswordError" role="alert" hidden></p>
    </div>
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" name="new_password" required minlength="8" autocomplete="new-password" />
      <p class="form-field-error" id="newPasswordError" role="alert" hidden></p>
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" name="confirm_password" required autocomplete="new-password" />
      <p class="form-field-error" id="confirmPasswordError" role="alert" hidden></p>
    </div>
    <button type="submit" class="btn btn-primary">Update Password</button>
  </form>
</div>
