<div class="settings-card">
  <h3>Frequently Asked Questions</h3>

  <div class="faq-item">
    <button class="faq-question" type="button">
      <span>How do I reset my password?</span>
      <i class="fa-solid fa-chevron-down faq-icon"></i>
    </button>
    <div class="faq-answer">
      <p>
        Go to <b>Account Security</b> and fill out the password reset form. Enter your current password, then provide a new password (minimum 8 characters).
      </p>
    </div>
  </div>

  <div class="faq-item">
    <button class="faq-question" type="button">
      <span>How can I view my activity log?</span>
      <i class="fa-solid fa-chevron-down faq-icon"></i>
    </button>
    <div class="faq-answer">
      <p>
        Open <b>Activity Log</b>. Use the search bar to filter by date, action, details, or IP address.
      </p>
    </div>
  </div>
</div>
