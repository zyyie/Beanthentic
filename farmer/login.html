<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var loc = window.location;
        if (loc.protocol !== 'https:') return;
        var host = (loc.hostname || '').toLowerCase();
        if (host === '127.0.0.1' || host === 'localhost' || /^\d{1,3}(\.\d{1,3}){3}$/.test(host)) {
          loc.replace('http://' + loc.host + loc.pathname + loc.search + loc.hash);
        }
      })();
    </script>
    <title>Beanthentic | Farmer Login</title>
    <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/motion.css">
  <link rel="stylesheet" href="../css/site-polish.css">
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <style>
      .form-alert { text-align: left; margin-bottom: 0.25rem; }
      .form-alert-error { color: #c0392b; }
      .form-alert-success { color: #166534; }
    </style>
  </head>
  <body class="login-page">
    <main id="main" class="login-main">
      <div class="login-wrap">
        <section class="card login-card-split" aria-label="Farmer login form">
          <div class="login-card-left" aria-hidden="true">
            <img src="../assets/images/logo.png" alt="Beanthentic logo" class="login-card-logo" />
          </div>

          <div class="login-card-right">
            <div class="card-header">
              <h2 class="card-title">Farmer Portal</h2>
              <p class="card-desc">Log in to view and reply to messages.</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
              <p class="form-alert form-alert-{{ category }}">{{ message }}</p>
              {% endfor %}
            {% endwith %}

            <form class="form" action="{{ url_for('farmer_login') }}" method="post" novalidate>
              {% if error %}
              <p class="fineprint" style="color: #c0392b">{{ error }}</p>
              {% endif %}

              <div class="field">
                <label class="label" for="phone">Phone Number:</label>
                <div class="input-group">
                  <span class="input-prefix">+63</span>
                  <input class="input" id="phone" name="phone" type="text" autocomplete="tel" placeholder="9123456789" required />
                </div>
              </div>

              <div class="field">
                <label class="label" for="password">Password:</label>
                <div class="password-wrap">
                  <input
                    class="input"
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                  />
                  <button type="button" class="password-toggle" id="togglePassword" data-target="password" aria-label="Show password" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"></svg>
                  </button>
                </div>
              </div>

              <button class="btn" type="submit">LOGIN</button>

              <div class="login-form-footer">
                <p class="fineprint">
                  <a class="link" href="{{ url_for('farmer_forgot_password') }}">Forgot password?</a>
                </p>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>
    <script src="../js/auth-password-toggle.js"></script>
    <script src="../js/site-polish.js"></script>
  </body>
</html>
