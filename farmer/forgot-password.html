<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beanthentic | Farmer Forgot Password</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="../css/forgot-password.css" />
  </head>
  <body class="login-page">
    <main id="main" class="login-main">
      <div class="login-wrap">
        <section class="card login-card-split" aria-label="Farmer forgot password form">
          <div class="login-card-left" aria-hidden="true">
            <img src="../assets/images/logo.png" alt="Beanthentic logo" class="login-card-logo" />
          </div>

          <div class="login-card-right">
            <div class="card-header">
              <h2 class="card-title">Forgot Password?</h2>
              <p class="card-desc">Enter your registered phone number. We will text you a 6-digit code.</p>
            </div>

            <form class="form" action="{{ url_for('farmer_forgot_password') }}" method="post">
              {% if error %}
              <p class="fineprint form-alert form-alert-error">{{ error }}</p>
              {% endif %}

              <div class="field">
                <label class="label" for="phone">Phone Number:</label>
                <div class="input-group">
                  <span class="input-prefix">+63</span>
                  <input
                    class="input"
                    id="phone"
                    name="phone"
                    type="text"
                    autocomplete="tel"
                    placeholder="9123456789"
                    required
                  />
                </div>
              </div>

              <button class="btn" type="submit">SEND CODE</button>

              <div class="login-form-footer">
                <p class="fineprint">
                  <a class="link" href="{{ url_for('farmer_login') }}">Back to Farmer Login</a>
                </p>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>
    <script>
      (function () {
        const phoneInput = document.getElementById("phone");
        if (!phoneInput) return;
        phoneInput.addEventListener("input", function (e) {
          let value = e.target.value.replace(/\D/g, "");
          if (value.length > 10) value = value.slice(0, 10);
          e.target.value = value;
        });
      })();
    </script>
  </body>
</html>
